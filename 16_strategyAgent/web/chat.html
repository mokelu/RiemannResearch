<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riemann Research — Right Panel · live AG-UI agent (folder 16)</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23000000'/%3E%3Cg fill='%23ffffff'%3E%3Crect x='3' y='30' width='6' height='12' rx='1.5'/%3E%3Crect x='12' y='18' width='6' height='24' rx='1.5'/%3E%3Crect x='21' y='4' width='6' height='38' rx='1.5'/%3E%3Crect x='30' y='18' width='6' height='24' rx='1.5'/%3E%3Crect x='39' y='30' width='6' height='12' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- CDN only: React 18 + marked (same stack as file 15). No build step. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/marked@15.0.4/marked.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root{
    --bg:#FBFAF7; --panel:#F4F3EE; --panel2:#FFFFFF; --panel3:#ECEAE3;
    --line:#E6E5DF; --line2:#D6D5CE;
    --text:#14130F; --mut:#45443F; --mut2:#76756E;
    --amber:#1A4D3E; --amber-dim:#EAF1ED;
    --up:#1A7F37; --dn:#CF2221; --blue:#0969DA; --violet:#8250DF;
    --chrome:var(--bg); --card:#FFFFFF; --on-accent:#FFFFFF; --text-2:#3A3933;
    --msg-user:#E7E6DF; --edge-active:#CFCFC7; --hover-2:#C3C2BA;
    --thumb:#C9C7BE; --thumb-h:var(--line2);
    --plate:#000000; --on-plate:#FFFFFF;
    --sans:"Space Grotesk",sans-serif; --mono:"IBM Plex Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  ::selection{background:color-mix(in srgb, var(--amber) 18%, transparent);color:var(--text)}
  html,body,#root{height:100%}
  body{background:var(--chrome);color:var(--text);font-family:var(--sans);overflow:hidden;caret-color:var(--amber)}
  /* frame that centers the lone right panel on the workspace backdrop */
  #frame{height:100%;display:flex;align-items:stretch;justify-content:center}

  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  textarea{font-family:var(--mono);color:var(--text)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--thumb-h)}

  /* ══════════ RIGHT PANEL — the AI chat (copied from file 15) ══════════ */
  #right{width:440px;max-width:100%;height:100%;background:var(--bg);border-left:1px solid var(--line);
    border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none;position:relative;z-index:2}
  .chatHead{flex:none;display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}
  .chatHead .aiDot{width:22px;height:22px;flex:none;color:var(--plate);display:flex;align-items:center;justify-content:center}
  .chatHead .aiDot svg{width:16px;height:16px;display:block}
  .chatHead .cht{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
  .chatHead .chs{font-family:var(--mono);font-size:8.5px;color:var(--mut2)}
  .chatHead .newc{margin-left:auto;font-size:15px;color:var(--mut2);width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
  .chatHead .newc:hover{color:var(--amber);background:var(--panel2)}
  #msgs{flex:1;overflow-y:auto;padding:14px 13px 8px;display:flex;flex-direction:column;gap:12px}
  .msgU{align-self:flex-end;max-width:86%;background:var(--msg-user);border:1px solid var(--line2);
    border-radius:12px 12px 3px 12px;padding:8px 12px;font-size:12.5px;line-height:1.55;color:var(--text)}
  .msgA{align-self:flex-start;max-width:94%;display:flex;gap:9px}
  .msgA .amark{width:18px;height:18px;flex:none;margin-top:2px;color:var(--plate);display:flex;align-items:center;justify-content:center}
  .msgA .amark svg{width:13px;height:13px;display:block}
  .msgA .abody{font-size:12.5px;line-height:1.65;color:var(--mut);min-width:0}
  .msgA .abody p{margin:.35em 0}
  .msgA .abody h1,.msgA .abody h2,.msgA .abody h3{margin:.5em 0 .3em;font-size:1.02em;color:var(--text)}
  .msgA .abody ul{margin:.4em 0 .4em 1.1em}
  .msgA .abody code{font-family:var(--mono);font-size:.88em;color:var(--amber)}
  .msgA .abody pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:.5em 0}
  .msgA .abody pre code{color:var(--text);background:none;font-size:10.5px;line-height:1.6}
  .msgA .abody table{border-collapse:collapse;font-family:var(--mono);font-size:10px;margin:.5em 0}
  .msgA .abody th,.msgA .abody td{border:1px solid var(--line2);padding:3px 8px}
  .msgA .abody th{color:var(--mut2)}
  .typing{display:inline-flex;gap:4px;padding:4px 2px}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--mut2);animation:bl 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
  @keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
  .chatEmpty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut2);padding:0 26px;text-align:center}
  .chatEmpty .big{font-size:13.5px;color:var(--mut);font-weight:600}
  .suggest{font-size:11.5px;border:1px solid var(--line2);border-radius:99px;padding:6px 13px;color:var(--mut);cursor:pointer}
  .suggest:hover{color:var(--amber);border-color:var(--amber);background:var(--amber-dim)}

  /* composer — model selector, mode, voice, send all inside the input box */
  .composer{flex:none;padding:10px 12px 12px}
  .cbox{border:1px solid var(--line2);border-radius:14px;background:var(--panel);overflow:hidden;transition:border-color .15s}
  .cbox:focus-within{border-color:var(--amber)}
  .cbox textarea{width:100%;min-height:58px;max-height:170px;background:none;border:none;padding:11px 13px 4px;
    font-family:var(--sans);font-size:12.5px;line-height:1.55;color:var(--text);outline:none;resize:none;display:block;caret-color:var(--amber)}
  .cbox textarea::placeholder{color:var(--mut2)}
  .crow2{display:flex;align-items:center;gap:6px;padding:6px 8px 8px}
  .selwrap{position:relative}
  .pillSel{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;color:var(--mut);
    border:1px solid var(--line2);border-radius:99px;padding:4px 9px;background:var(--bg);cursor:pointer;white-space:nowrap}
  .pillSel:hover{color:var(--text);border-color:var(--mut2)}
  .pillSel .car{font-size:8px;color:var(--mut2)}
  .selMenu{position:absolute;bottom:calc(100% + 6px);left:0;min-width:190px;background:var(--panel2);
    border:1px solid var(--line2);border-radius:10px;padding:5px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .selMenu .sopt{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:11.5px}
  .selMenu .sopt:hover{background:var(--panel3)}
  .selMenu .sopt.on{color:var(--amber)}
  .selMenu .sopt .sd{width:5px;height:5px;border-radius:50%;background:var(--mut2);flex:none}
  .selMenu .sopt.on .sd{background:var(--amber)}
  .selMenu .sopt small{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--mut2)}
  .icBtn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--mut2);flex:none;transition:color .15s,background .15s}
  .icBtn:hover{color:var(--text);background:var(--panel3)}
  .icBtn svg{width:14px;height:14px}
  #sendBtn{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--on-accent);
    display:flex;align-items:center;justify-content:center;transition:filter .15s,opacity .15s;flex:none}
  #sendBtn svg{width:14px;height:14px;stroke-width:2.6}
  #sendBtn:hover{filter:brightness(1.1)}
  #sendBtn.off{opacity:.35;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

/* ── icons + logo, copied from file 15 ── */
const Ico = ({ d, ...p }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
    strokeLinecap="round" strokeLinejoin="round" {...p}><path d={d} /></svg>
);
const IC = {
  mic: "M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z M19 10v1a7 7 0 0 1-14 0v-1 M12 18v4",
  send: "M12 19V5 M5 12l7-7 7 7",
};
const RiemannMark = () => (
  <svg viewBox="0 0 48 48" fill="currentColor" aria-hidden="true">
    <rect x="3" y="30" width="6" height="12" rx="1.5" />
    <rect x="12" y="18" width="6" height="24" rx="1.5" />
    <rect x="21" y="4" width="6" height="38" rx="1.5" />
    <rect x="30" y="18" width="6" height="24" rx="1.5" />
    <rect x="39" y="30" width="6" height="12" rx="1.5" />
  </svg>
);

const MODELS = [
  { name: "Riemann 1", tag: "market", desc: "the research model" },
  { name: "Riemann 1 · Pro", tag: "market", desc: "deeper investigation" },
];
const MODES = ["Ask", "Investigate", "Deep search"];

const AGENT_URL = "/agent";
const nid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));

/* ── stream one turn from the AG-UI server, appending deltas via onDelta ── */
async function streamTurn(messages, onDelta) {
  const res = await fetch(AGENT_URL, {
    method: "POST",
    headers: { "content-type": "application/json", accept: "text/event-stream" },
    body: JSON.stringify({
      threadId: "thread-1",
      runId: nid(),
      state: {},
      messages: messages.map(m => ({ id: nid(), role: m.role, content: m.content })),
      tools: [], context: [], forwardedProps: {},
    }),
  });
  if (!res.ok || !res.body) throw new Error("server responded " + res.status);

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let sep;
    while ((sep = buf.indexOf("\n\n")) >= 0) {
      const frame = buf.slice(0, sep); buf = buf.slice(sep + 2);
      for (const line of frame.split("\n")) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (!data) continue;
        let ev; try { ev = JSON.parse(data); } catch (e) { continue; }
        if (ev.type === "TEXT_MESSAGE_CONTENT" && ev.delta) onDelta(ev.delta);
        else if (ev.type === "RUN_ERROR") onDelta("\n\n⚠ " + (ev.message || "agent error"));
      }
    }
  }
}

function ChatPanel() {
  const [msgs, setMsgs] = useState([]);          // {role:"u"|"a", content}
  const [draft, setDraft] = useState("");
  const [model, setModel] = useState(MODELS[0].name);
  const [mode, setMode] = useState(MODES[0]);
  const [menu, setMenu] = useState(null);
  const [thinking, setThinking] = useState(false);
  const bodyRef = useRef(null);
  const threadIdRef = useRef(nid());

  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, [msgs, thinking]);

  const send = async (text) => {
    const content = (text ?? draft).trim();
    if (!content || thinking) return;
    const history = [...msgs, { role: "user", content }];
    setMsgs(history.map(m => ({ ...m })));
    setDraft("");
    setThinking(true);
    // open an empty assistant message we grow as deltas arrive
    setMsgs(ms => [...ms, { role: "assistant", content: "" }]);
    try {
      await streamTurn(
        history.map(m => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.content })),
        (delta) => setMsgs(ms => {
          const copy = ms.slice();
          copy[copy.length - 1] = { ...copy[copy.length - 1], content: copy[copy.length - 1].content + delta };
          return copy;
        })
      );
    } catch (e) {
      setMsgs(ms => {
        const copy = ms.slice();
        copy[copy.length - 1] = { ...copy[copy.length - 1], content: "⚠ could not reach the agent — is `uv run python server/agui_server.py` running?\n\n" + String(e.message || e) };
        return copy;
      });
    } finally {
      setThinking(false);
    }
  };
  const newChat = () => { setMsgs([]); setDraft(""); threadIdRef.current = nid(); };

  return (
    <aside id="right">
      <div className="chatHead">
        <span className="aiDot"><RiemannMark /></span>
        <div style={{ minWidth: 0 }}>
          <div className="cht">{msgs.length ? msgs.find(m => m.role === "u").content.slice(0, 40) : "New conversation"}</div>
          <div className="chs">{model} · live via AG-UI · mercury-2.5</div>
        </div>
        <button className="newc" title="New conversation" onClick={newChat}>＋</button>
      </div>

      <div id="msgs" ref={bodyRef}>
        {msgs.length === 0 && !thinking && (
          <div className="chatEmpty">
            <span className="big">Ask about a market — get the Optuna strategy</span>
            <span style={{ fontSize: 11, lineHeight: 1.7 }}>Type a question. The AI reads it and writes the<br />search space folder 13 will optimize, streamed live.</span>
            {["BTC drawdowns past 20% — build a mean-reversion space", "I want a fast/slow MA crossover with an RSI gate", "Search for a low-frequency trend space with an ATR stop"].map(s => (
              <button key={s} className="suggest" onClick={() => send(s)}>{s}</button>))}
          </div>
        )}
        {msgs.map((m, i) => m.role === "u" ? (
          <div className="msgU" key={i}>{m.content}</div>
        ) : (
          <div className="msgA" key={i}>
            <span className="amark"><RiemannMark /></span>
            <div className="abody" dangerouslySetInnerHTML={{ __html: window.marked.parse(m.content || "") }} />
          </div>
        ))}
      </div>

      <div className="composer">
        <div className="cbox">
          <textarea rows="2" placeholder={"Ask " + model + " to write the strategy…"}
            value={draft}
            onChange={e => setDraft(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }} />
          <div className="crow2">
            <div className="selwrap">
              <button className="pillSel" onClick={() => setMenu(menu === "model" ? null : "model")}>◈ {model}<span className="car">▾</span></button>
              {menu === "model" && (
                <div className="selMenu">
                  {MODELS.map(m => (
                    <div key={m.name} className={"sopt" + (model === m.name ? " on" : "")}
                      onClick={() => { setModel(m.name); setMenu(null); }}>
                      <span className="sd"></span>{m.name}<small>{m.tag}</small>
                    </div>))}
                </div>
              )}
            </div>
            <div className="selwrap">
              <button className="pillSel" onClick={() => setMenu(menu === "mode" ? null : "mode")}>{mode}<span className="car">▾</span></button>
              {menu === "mode" && (
                <div className="selMenu">
                  {MODES.map(m => (
                    <div key={m} className={"sopt" + (mode === m ? " on" : "")}
                      onClick={() => { setMode(m); setMenu(null); }}><span className="sd"></span>{m}</div>))}
                </div>
              )}
            </div>
            <button className="icBtn" title="Voice input (not wired yet)"><Ico d={IC.mic} /></button>
            <button id="sendBtn" className={draft.trim() && !thinking ? "" : "off"} title="Send (Enter)" onClick={() => send()}>
              <Ico d={IC.send} />
            </button>
          </div>
        </div>
      </div>
    </aside>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <div id="frame"><ChatPanel /></div>
);
</script>
</body>
</html>
