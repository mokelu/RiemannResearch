<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IronCalc Memory Benchmark</title>
<style>
  :root {
    --bg: #0b0d0c;
    --panel: #14171a;
    --panel-2: #191d1a;
    --border: #2a2f2c;
    --text: #d8ddd6;
    --dim: #7c8880;
    --amber: #ffb703;
    --amber-dim: #8a6a1f;
    --red: #ff6b5e;
    --green: #6bd68a;
    --mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
  }

  body {
    min-height: 100vh;
    padding: 32px 20px 60px;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
  }

  /* ---- Header / status bar ---- */
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 8px;
  }

  h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--text);
  }

  h1 span { color: var(--amber); }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--dim);
  }

  .led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dim);
    flex: none;
  }
  .led.ready { background: var(--green); }
  .led.busy { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
  .led.error { background: var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ---- Controls ---- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .runbtn {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease;
  }

  .runbtn:hover:not(:disabled) {
    border-color: var(--amber-dim);
    color: var(--amber);
  }

  .runbtn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .runbtn.cancel {
    border-color: var(--red);
    color: var(--red);
  }

  .field {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--dim);
  }

  .field input {
    width: 64px;
    font-family: var(--mono);
    font-size: 13px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 8px;
  }
  .field input:focus { outline: 1px solid var(--amber-dim); }

  .subrow {
    font-size: 11px;
    color: var(--dim);
    margin: 0 0 20px;
  }

  /* ---- Console output ---- */
  .console {
    background: #0a0c0a;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 18px;
    font-size: 13px;
    line-height: 1.55;
    color: var(--green);
    white-space: pre-wrap;
    max-height: 420px;
    overflow-y: auto;
  }

  .console .dim-line { color: var(--dim); }
  .console .err-line { color: var(--red); }
  .console .hd-line { color: var(--amber); }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 13px;
    background: var(--amber);
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- Results table ---- */
  .results {
    margin-top: 22px;
  }

  .results h2 {
    font-size: 12px;
    text-transform: none;
    color: var(--dim);
    font-weight: 500;
    margin: 0 0 8px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  th, td {
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
  }

  th {
    color: var(--dim);
    font-weight: 500;
  }

  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }

  tr.fail td { color: var(--red); }

  .empty-note {
    font-size: 12px;
    color: var(--dim);
  }

  .footer-note {
    margin-top: 28px;
    font-size: 11px;
    color: var(--dim);
    max-width: 66ch;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>IronCalc <span>Memory Benchmark</span></h1>
    <div class="status">
      <span class="led" id="led"></span>
      <span id="statusText">initializing</span>
    </div>
  </div>

  <div class="controls">
    <button class="runbtn" data-rows="1000">1K rows</button>
    <button class="runbtn" data-rows="10000">10K rows</button>
    <button class="runbtn" data-rows="100000">100K rows</button>
    <button class="runbtn" data-rows="1000000">1M rows</button>
    <div class="field">
      <label for="cols">cols</label>
      <input id="cols" type="number" min="1" max="200" value="10" />
    </div>
    <button class="runbtn cancel" id="cancelBtn" style="display:none">cancel run</button>
    <button class="runbtn" id="clearBtn">clear log</button>
  </div>
  <p class="subrow">Each run builds a CSV in memory, loads it cell-by-cell into a fresh IronCalc model, evaluates it, and samples heap usage before/after.</p>

  <div class="console" id="output">Loading WASM…<span class="cursor"></span></div>

  <div class="results">
    <h2>Run history</h2>
    <div id="resultsBody">
      <p class="empty-note">No runs yet.</p>
    </div>
  </div>

  <p class="footer-note" id="memNote"></p>

</div>

<script type="module">
  import init, { Model } from '@ironcalc/wasm';

  const out = document.getElementById('output');
  const led = document.getElementById('led');
  const statusText = document.getElementById('statusText');
  const cancelBtn = document.getElementById('cancelBtn');
  const clearBtn = document.getElementById('clearBtn');
  const colsInput = document.getElementById('cols');
  const resultsBody = document.getElementById('resultsBody');
  const memNote = document.getElementById('memNote');
  const runButtons = Array.from(document.querySelectorAll('button[data-rows]'));

  const history = [];
  let cancelled = false;
  let running = false;

  const sleep = (ms = 0) => new Promise((r) => setTimeout(r, ms));
  const fmt = (n) => n.toLocaleString();

  const preciseMemoryAvailable = () => typeof performance.measureUserAgentSpecificMemory === 'function' && window.crossOriginIsolated;

  function setStatus(kind, label) {
    led.className = 'led ' + kind;
    statusText.textContent = label;
  }

  function stripCursor() {
    const c = out.querySelector('.cursor');
    if (c) c.remove();
  }

  function log(msg, cls) {
    stripCursor();
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
  }

  function logCursor() {
    const c = document.createElement('span');
    c.className = 'cursor';
    out.appendChild(c);
  }

  async function mem() {
    try {
      if (preciseMemoryAvailable()) {
        const r = await performance.measureUserAgentSpecificMemory();
        return { mb: r.bytes / 1024 / 1024, label: (r.bytes / 1024 / 1024).toFixed(2) + ' MB' };
      }
    } catch { /* fall through to JS heap estimate */ }
    if (performance.memory) {
      const mb = performance.memory.usedJSHeapSize / 1024 / 1024;
      return { mb, label: mb.toFixed(2) + ' MB (JS heap, approximate)' };
    }
    return { mb: null, label: 'unavailable in this browser' };
  }

  function buildCsv(rows, cols) {
    const parts = new Array(rows + 1);
    parts[0] = Array.from({ length: cols }, (_, i) => 'c' + i).join(',');
    for (let r = 0; r < rows; r++) {
      const row = new Array(cols);
      for (let c = 0; c < cols; c++) row[c] = r * cols + c;
      parts[r + 1] = row.join(',');
    }
    return parts.join('\n') + '\n';
  }

  async function loadAndEval(model, csvStr, rows) {
    const rowsData = csvStr.trim().split('\n').slice(1);
    const step = rows >= 200000 ? 20000 : 2000;
    for (let ri = 0; ri < rowsData.length; ri++) {
      if (cancelled) throw new Error('CANCELLED');
      const cells = rowsData[ri].split(',');
      for (let ci = 0; ci < cells.length; ci++) {
        model.setUserInput(0, ri + 1, ci + 1, cells[ci]);
      }
      if (ri % step === 0 && ri > 0) {
        log(`  ${fmt(ri)} / ${fmt(rowsData.length)} rows loaded…`, 'dim-line');
        await sleep();
      }
    }
    model.evaluate();
  }

  function renderResults() {
    if (!history.length) {
      resultsBody.innerHTML = '<p class="empty-note">No runs yet.</p>';
      return;
    }
    const rows = history.map((h) => `
      <tr class="${h.ok ? '' : 'fail'}">
        <td>${fmt(h.rows)} × ${h.cols}</td>
        <td class="num">${h.ok ? fmt(h.cells) : '—'}</td>
        <td class="num">${h.ok ? h.csvMb.toFixed(1) + ' MB' : '—'}</td>
        <td class="num">${h.ok ? h.time.toFixed(2) + ' s' : '—'}</td>
        <td class="num">${h.ok ? fmt(Math.round(h.cellsPerSec)) : '—'}</td>
        <td class="num">${h.ok ? h.memDeltaLabel : (h.cancelled ? 'cancelled' : 'error')}</td>
      </tr>`).join('');
    resultsBody.innerHTML = `
      <table>
        <thead><tr>
          <th>shape</th><th class="num">cells</th><th class="num">csv size</th>
          <th class="num">load+eval</th><th class="num">cells/s</th><th class="num">Δ memory</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function setRunning(isRunning) {
    running = isRunning;
    runButtons.forEach((b) => (b.disabled = isRunning));
    cancelBtn.style.display = isRunning ? 'inline-block' : 'none';
    setStatus(isRunning ? 'busy' : 'ready', isRunning ? 'running…' : 'ready');
  }

  async function test(rows) {
    if (running) return;
    cancelled = false;
    setRunning(true);

    const cols = Math.max(1, Math.min(200, Number(colsInput.value) || 10));
    log('');
    log(`--- ${fmt(rows)} rows × ${cols} cols = ${fmt(rows * cols)} cells ---`, 'hd-line');

    const record = { rows, cols, ok: false };
    try {
      log('Building CSV…', 'dim-line');
      await sleep();
      const csvStr = buildCsv(rows, cols);
      const csvMb = new TextEncoder().encode(csvStr).byteLength / 1024 / 1024;
      log(`CSV size: ${csvMb.toFixed(2)} MB`);

      const before = await mem();
      log(`Memory before: ${before.label}`);
      log('Loading into IronCalc…');

      const model = new Model('benchmark.xlsx', 'en', 'UTC', 'en');
      const t0 = performance.now();
      await loadAndEval(model, csvStr, rows);
      const seconds = (performance.now() - t0) / 1000;

      const after = await mem();
      log(`Load + evaluate: ${seconds.toFixed(2)} s  (${fmt(Math.round((rows * cols) / seconds))} cells/s)`);
      log(`Memory after: ${after.label}`, 'hd-line');

      let memDeltaLabel = 'n/a';
      if (before.mb != null && after.mb != null) {
        memDeltaLabel = (after.mb - before.mb >= 0 ? '+' : '') + (after.mb - before.mb).toFixed(2) + ' MB';
      }

      Object.assign(record, {
        ok: true,
        cells: rows * cols,
        csvMb,
        time: seconds,
        cellsPerSec: (rows * cols) / seconds,
        memDeltaLabel,
      });
    } catch (err) {
      if (err && err.message === 'CANCELLED') {
        log('Run cancelled.', 'err-line');
        record.cancelled = true;
      } else {
        log(`Error: ${err && err.message ? err.message : err}`, 'err-line');
        setStatus('error', 'error — see log');
      }
    } finally {
      history.unshift(record);
      renderResults();
      setRunning(false);
      logCursor();
    }
  }

  clearBtn.addEventListener('click', () => {
    out.innerHTML = '';
    logCursor();
  });

  cancelBtn.addEventListener('click', () => {
    cancelled = true;
  });

  runButtons.forEach((btn) => {
    btn.addEventListener('click', () => test(Number(btn.dataset.rows)));
  });

  (async function boot() {
    try {
      await init();
      out.textContent = '';
      log('IronCalc WASM ready. Pick a run above.');
      logCursor();
      setStatus('ready', 'ready');
      memNote.textContent = preciseMemoryAvailable()
        ? 'Using performance.measureUserAgentSpecificMemory() for precise process memory.'
        : 'Precise memory measurement unavailable here (requires cross-origin isolation) — falling back to JS heap size, which undercounts WASM memory.';
    } catch (err) {
      out.textContent = 'Failed to load WASM module: ' + (err && err.message ? err.message : err);
      setStatus('error', 'load failed');
    }
  })();
</script>
</body>
</html>
